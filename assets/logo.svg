<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Subagents Panel</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2440"/>
      <stop offset="1" stop-color="#14121E"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="a1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2A65A"/>
      <stop offset="1" stop-color="#E0663A"/>
    </linearGradient>
    <linearGradient id="a2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B49CF5"/>
      <stop offset="1" stop-color="#7C5CE0"/>
    </linearGradient>
    <linearGradient id="a3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6FE0C0"/>
      <stop offset="1" stop-color="#2FAF8F"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- The side panel -->
  <rect x="96" y="84" width="320" height="344" rx="36" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="3"/>

  <!-- Three agent rows: an avatar, a title bar, a status line -->
  <!-- Row 1: a star -->
  <circle cx="156" cy="160" r="30" fill="url(#a1)" fill-opacity="0.22"/>
  <polygon fill="url(#a1)" stroke="url(#a1)" stroke-width="2" stroke-linejoin="round"
    points="156,138 161.4,151.2 175.1,149.0 166.8,160.0 175.1,171.0 161.4,168.8 156,182 150.6,168.8 136.9,171.0 145.2,160.0 136.9,149.0 150.6,151.2"/>
  <rect x="204" y="146" width="150" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.85"/>
  <rect x="204" y="168" width="96" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.35"/>

  <!-- Row 2: a flower -->
  <circle cx="156" cy="256" r="30" fill="url(#a2)" fill-opacity="0.22"/>
  <g fill="url(#a2)">
    <ellipse cx="156" cy="242" rx="7" ry="13"/>
    <ellipse cx="156" cy="242" rx="7" ry="13" transform="rotate(72 156 256)"/>
    <ellipse cx="156" cy="242" rx="7" ry="13" transform="rotate(144 156 256)"/>
    <ellipse cx="156" cy="242" rx="7" ry="13" transform="rotate(216 156 256)"/>
    <ellipse cx="156" cy="242" rx="7" ry="13" transform="rotate(288 156 256)"/>
  </g>
  <circle cx="156" cy="256" r="6" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="204" y="242" width="124" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.85"/>
  <rect x="204" y="264" width="132" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.35"/>

  <!-- Row 3: an orbit -->
  <circle cx="156" cy="352" r="30" fill="url(#a3)" fill-opacity="0.22"/>
  <circle cx="156" cy="352" r="19" fill="none" stroke="url(#a3)" stroke-width="3"/>
  <circle cx="156" cy="352" r="9" fill="url(#a3)"/>
  <circle cx="175" cy="352" r="4.5" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="204" y="338" width="140" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.85"/>
  <rect x="204" y="360" width="80" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.35"/>

  <!-- A live "running" dot on the first agent -->
  <circle cx="378" cy="153" r="9" fill="#F2A65A"/>
  <circle cx="378" cy="153" r="16" fill="none" stroke="#F2A65A" stroke-opacity="0.35" stroke-width="3"/>
</svg>
